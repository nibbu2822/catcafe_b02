name: CI Pipeline

on:
    push:
        branches: [ "main", "master" ]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 26
                  cache: gradle

            - run: chmod +x gradlew
            - run: ./gradlew clean build

    test:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 26
                  cache: gradle

            - run: chmod +x gradlew
            - run: ./gradlew test

    format:
        runs-on: ubuntu-latest
        needs: test

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 26
                  cache: gradle

            - run: chmod +x gradlew
            - run: ./gradlew spotlessCheck
